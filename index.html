  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SketchCast • Realtime Interactive Keynotes &amp; Quizzing Arena</title>
    <meta name="description" content="Next-Generation Interactive Keynotes, Realtime Quizzing, Live Voting, and Crowdsourced Q&amp;A Arena." />

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Web App Manifest (PWA) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple iOS Web App & Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SketchCast" />

    <!-- Android & Windows Application Metadata -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="SketchCast" />
    <meta name="msapplication-TileColor" content="#f5f0e9" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <meta name="theme-color" content="#f5f0e9" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sketchcast_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark) || (saved === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0c0f0f');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SketchCast • Realtime Keynotes & Quizzing Arena" />
